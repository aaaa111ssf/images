name: Sync images to B2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [b2]
          type = b2
          account = ${{ secrets.B2_KEY_ID }}
          key = ${{ secrets.B2_APP_KEY }}
          hard_delete = true
          EOF

      - name: Sync to B2
        run: |
          rclone sync ./ \
            b2:${{ secrets.B2_BUCKET }} \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --exclude "*.md" \
            --fast-list --transfers 8 \
            --verbose
